<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asistente — Técnica N°6 Morón</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg:        #f5f2eb;
      --surface:   #ffffff;
      --border:    #e0dbd0;
      --accent:    #1a3a6b;   /* azul escolar */
      --accent2:   #d4a017;   /* dorado */
      --user-bg:   #1a3a6b;
      --user-txt:  #ffffff;
      --bot-bg:    #ffffff;
      --bot-txt:   #1c1c1c;
      --muted:     #888;
      --text:      #1c1c1c;
      --radius:    14px;
      --sans:      'Familjen Grotesk', sans-serif;
      --mono:      'JetBrains Mono', monospace;
      --shadow:    0 2px 16px rgba(26,58,107,.10);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      font-family: var(--sans);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      background: var(--accent);
      color: #fff;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      box-shadow: 0 2px 12px rgba(0,0,0,.18);
      flex-shrink: 0;
      z-index: 10;
    }

    .logo {
      width: 44px; height: 44px;
      background: var(--accent2);
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--accent);
      flex-shrink: 0;
      letter-spacing: -.02em;
    }

    .header-text h1 {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -.01em;
      line-height: 1.2;
    }
    .header-text p {
      font-size: .75rem;
      opacity: .7;
      font-family: var(--mono);
    }

    .status-dot {
      width: 8px; height: 8px;
      background: #4cdd7a;
      border-radius: 50%;
      margin-left: auto;
      box-shadow: 0 0 0 3px rgba(76,221,122,.25);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 3px rgba(76,221,122,.25); }
      50%      { box-shadow: 0 0 0 6px rgba(76,221,122,.10); }
    }

    /* ── Sugerencias rápidas ── */
    .chips {
      display: flex;
      gap: .5rem;
      padding: .75rem 1.25rem;
      overflow-x: auto;
      flex-shrink: 0;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      scrollbar-width: none;
    }
    .chips::-webkit-scrollbar { display: none; }

    .chip {
      white-space: nowrap;
      font-size: .75rem;
      font-family: var(--mono);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: .35rem .85rem;
      cursor: pointer;
      transition: all .15s;
      color: var(--accent);
      font-weight: 500;
      flex-shrink: 0;
    }
    .chip:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* ── Mensajes ── */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: .85rem;
      scroll-behavior: smooth;
    }

    .msg {
      display: flex;
      gap: .6rem;
      align-items: flex-end;
      animation: fadeUp .25s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg.user { flex-direction: row-reverse; }

    .avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      font-size: .75rem;
      font-weight: 700;
    }
    .msg.bot  .avatar { background: var(--accent); color: #fff; }
    .msg.user .avatar { background: var(--accent2); color: var(--accent); }

    .bubble {
      max-width: min(72%, 520px);
      padding: .7rem 1rem;
      border-radius: var(--radius);
      font-size: .9rem;
      line-height: 1.55;
      box-shadow: var(--shadow);
    }
    .msg.bot  .bubble {
      background: var(--bot-bg);
      color: var(--bot-txt);
      border-bottom-left-radius: 4px;
      border: 1px solid var(--border);
    }
    .msg.user .bubble {
      background: var(--user-bg);
      color: var(--user-txt);
      border-bottom-right-radius: 4px;
    }

    .timestamp {
      font-size: .65rem;
      color: var(--muted);
      font-family: var(--mono);
      margin-top: .2rem;
      padding: 0 .3rem;
    }
    .msg.user .timestamp { text-align: right; }

    /* mensaje de bienvenida */
    .welcome {
      text-align: center;
      padding: 2rem 1rem 1rem;
      color: var(--muted);
    }
    .welcome .icon {
      font-size: 2.5rem;
      margin-bottom: .5rem;
      display: block;
    }
    .welcome h2 {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: .3rem;
    }
    .welcome p { font-size: .82rem; }

    /* typing indicator */
    .typing .bubble {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: .8rem 1rem;
    }
    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent);
      opacity: .4;
      animation: blink 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: .2s; }
    .dot:nth-child(3) { animation-delay: .4s; }
    @keyframes blink {
      0%,80%,100% { opacity: .4; transform: scale(1); }
      40%          { opacity: 1;  transform: scale(1.2); }
    }

    /* ── Input ── */
    .input-area {
      padding: .85rem 1.25rem 1rem;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      gap: .6rem;
      align-items: flex-end;
      flex-shrink: 0;
    }

    #input {
      flex: 1;
      resize: none;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: .65rem .9rem;
      font-family: var(--sans);
      font-size: .9rem;
      color: var(--text);
      background: var(--bg);
      outline: none;
      max-height: 120px;
      line-height: 1.45;
      transition: border-color .2s;
    }
    #input:focus { border-color: var(--accent); }
    #input::placeholder { color: var(--muted); }

    #sendBtn {
      width: 42px; height: 42px;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      transition: all .15s;
    }
    #sendBtn:hover:not(:disabled) { background: #142d54; transform: scale(1.05); }
    #sendBtn:disabled { opacity: .4; cursor: not-allowed; }
    #sendBtn svg { width: 18px; height: 18px; }

    /* scrollbar sutil */
    #chat::-webkit-scrollbar { width: 4px; }
    #chat::-webkit-scrollbar-track { background: transparent; }
    #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    @media (max-width: 480px) {
      .bubble { max-width: 85%; font-size: .85rem; }
      header  { padding: .75rem 1rem; }
    }
  </style>
</head>
<body>

<!-- ── Header ── -->
<header>
  <div class="logo">T6</div>
  <div class="header-text">
    <h1>Asistente Virtual</h1>
    <p>Escuela Técnica N°6 · Morón</p>
  </div>
  <div class="status-dot" title="En línea"></div>
</header>

<!-- ── Chips de sugerencias ── -->
<div class="chips">
  <button class="chip" onclick="enviarChip(this)">📋 Inscripción</button>
  <button class="chip" onclick="enviarChip(this)">🎓 Especialidades</button>
  <button class="chip" onclick="enviarChip(this)">🕐 Horarios</button>
  <button class="chip" onclick="enviarChip(this)">🔧 Talleres</button>
  <button class="chip" onclick="enviarChip(this)">📝 Evaluación y notas</button>
  <button class="chip" onclick="enviarChip(this)">💼 Pasantías</button>
  <button class="chip" onclick="enviarChip(this)">📐 Normas</button>
  <button class="chip" onclick="enviarChip(this)">💰 Cooperadora</button>
</div>

<!-- ── Mensajes ── -->
<div id="chat">
  <div class="welcome">
    <span class="icon">🏫</span>
    <h2>¡Hola! Soy el asistente de la Técnica N°6</h2>
    <p>Podés preguntarme sobre inscripciones, especialidades,<br>horarios, talleres y mucho más.</p>
  </div>
</div>

<!-- ── Input ── -->
<div class="input-area">
  <textarea id="input" rows="1" placeholder="Escribí tu consulta…"></textarea>
  <button id="sendBtn" onclick="enviar()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="22" y1="2" x2="11" y2="13"/>
      <polygon points="22 2 15 22 11 13 2 9 22 2"/>
    </svg>
  </button>
</div>

<script>
  // ── Configuración ────────────────────────────
  const API = 'http://localhost:3000/api/chat';
  let historial = [];

  // ── Helpers ──────────────────────────────────
  function hora() {
    return new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
  }

  function scrollAbajo() {
    const chat = document.getElementById('chat');
    chat.scrollTop = chat.scrollHeight;
  }

  function agregarMensaje(rol, texto) {
    const chat = document.getElementById('chat');

    // Quitar bienvenida si existe
    const welcome = chat.querySelector('.welcome');
    if (welcome) welcome.remove();

    const esUsuario = rol === 'user';
    const wrap = document.createElement('div');
    wrap.className = `msg ${esUsuario ? 'user' : 'bot'}`;

    wrap.innerHTML = `
      <div class="avatar">${esUsuario ? 'Vos' : 'T6'}</div>
      <div>
        <div class="bubble">${texto.replace(/\n/g, '<br>')}</div>
        <div class="timestamp">${hora()}</div>
      </div>
    `;

    chat.appendChild(wrap);
    scrollAbajo();
    return wrap;
  }

  function mostrarTyping() {
    const chat = document.getElementById('chat');
    const wrap = document.createElement('div');
    wrap.className = 'msg bot typing';
    wrap.id = 'typing';
    wrap.innerHTML = `
      <div class="avatar">T6</div>
      <div class="bubble">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    `;
    chat.appendChild(wrap);
    scrollAbajo();
  }

  function quitarTyping() {
    document.getElementById('typing')?.remove();
  }

  // ── Enviar mensaje ────────────────────────────
  async function enviar() {
    const input  = document.getElementById('input');
    const btn    = document.getElementById('sendBtn');
    const texto  = input.value.trim();
    if (!texto) return;

    input.value = '';
    input.style.height = 'auto';
    btn.disabled = true;

    agregarMensaje('user', texto);
    historial.push({ role: 'user', content: texto });
    mostrarTyping();

    try {
      const res = await fetch(API, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ mensaje: texto, historial }),
      });

      const data = await res.json();
      quitarTyping();

      if (!res.ok) throw new Error(data.error || 'Error del servidor');

      agregarMensaje('bot', data.respuesta);
      historial.push({ role: 'assistant', content: data.respuesta });

    } catch (err) {
      quitarTyping();
      agregarMensaje('bot', '⚠️ No pude conectarme con el servidor. Verificá que esté corriendo en el puerto 3000.');
      console.error(err);
    }

    btn.disabled = false;
    input.focus();
  }

  function enviarChip(chip) {
    document.getElementById('input').value = chip.textContent.replace(/^..\s/, '');
    enviar();
  }

  // ── Enter para enviar (Shift+Enter = salto de línea) ──
  document.getElementById('input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      enviar();
    }
  });

  // ── Autoresize del textarea ───────────────────
  document.getElementById('input').addEventListener('input', function () {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
  });
</script>
</body>
</html>
